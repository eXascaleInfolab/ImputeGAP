name: Pytest - ImputeGAP - IMPUTATION - EPSILON - 12 - SAITS

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'


    - name: Free disk space
      run: |
        df -h
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        sudo apt-get clean
        df -h
        

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmlpack-dev libopenblas-dev python3-dev build-essential
        pip install -r requirements.txt
        pip install mypy pytest

    - name: Check PyTorch environment
      run: |
        python --version
        python -m pip show torch torchvision torchaudio numpy scipy
        python -c "import torch; print('Torch:', torch.__version__); print('CUDA:', torch.version.cuda)"
            

    - name: Run pytest
      run: |
        python -m pytest ./tests/test_imputation_saits.py