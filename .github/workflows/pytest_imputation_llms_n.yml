name: Pytest - ImputeGAP - IMPUTATION - LLMs - 12

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        lfs: true


    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'


    - name: Free disk space
      run: |
        df -h
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        sudo apt-get clean
        df -h
        

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmlpack-dev libopenblas-dev python3-dev build-essential
        pip install -r requirements.txt
        pip install mypy pytest
        

    - name: Remove Triton for CPU-only tests
      run: |
        python -m pip uninstall -y triton
        python -m pip show torch tensorflow triton llvmlite || true
                

    - name: Test SAITS
      env:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        PYTHONFAULTHANDLER: "1"
      run: |
        python -m pytest -vv -s \
          ./tests/test_imputation_nuwats.py
