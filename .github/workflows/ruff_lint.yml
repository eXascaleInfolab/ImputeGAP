name: Ruff Lint - ImputeGAP

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff Linter with auto-fix
      run: ruff check imputegap/ --select E4,E7,E9,F63,F7,F82,PLR1704 --ignore E703 --exclude imputegap/wrapper --exclude imputegap/notebooks
